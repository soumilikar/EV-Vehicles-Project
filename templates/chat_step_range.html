{% extends "base.html" %}
{% block title %}EV Chatbot Assistant{% endblock %}
{% block content %}
    <h1>💬 EV Conversational Assistant</h1>

    <div id="nav-link">
        <a href="{{ url_for('home') }}">← Back to Main Form</a>
    </div>

    <div class="chat-recap">Got it — max budget €{{ '{:,.0f}'.format(price|float) }}.</div>

    <form action="{{ url_for('chat_result') }}" method="POST">
        <h2>Step 2 of 2</h2>
        <input type="hidden" name="PriceEuro" value="{{ price }}">
        <div class="input-group">
            <label for="Range_Km">What's the minimum range you need (km)?</label>
            <input type="number" id="Range_Km" name="Range_Km" value="400" required>
        </div>
        <button type="submit">Get My Recommendation →</button>
    </form>
{% endblock %}
